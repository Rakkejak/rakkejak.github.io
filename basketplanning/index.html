<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Basketplanning — Rakkejak</title>
<style>
:root{--bg:#f7f7f5;--panel:#fff;--text:#171717;--muted:#777b80;--line:#e5e5e2;--shadow:0 10px 30px rgba(0,0,0,.06);--coral:#e96a4a;--teal:#16a6a0}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input{font:inherit}button{cursor:pointer}.shell{width:min(980px,94vw);margin:34px auto 60px}.hero{background:var(--panel);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);padding:30px 32px 26px;margin-bottom:18px}.eyebrow{font-size:13px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--coral);margin-bottom:9px}h1{margin:0;font-size:clamp(42px,7vw,76px);line-height:.95;letter-spacing:-.05em;font-weight:950}.mode-nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}.mode-nav a{display:inline-block;border-radius:12px;padding:11px 14px;background:#efefec;color:#171717;text-decoration:none;font-weight:900;box-shadow:0 2px 0 rgba(0,0,0,.08)}.mode-nav a.active{background:#171717;color:#fff}.summary{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:24px;padding-top:18px;border-top:1px solid var(--line);flex-wrap:wrap}.open-count{font-weight:900;font-size:18px}.filters{display:flex;gap:8px;flex-wrap:wrap}.filter,.action,.save,.past-toggle{border:0;font-weight:850;box-shadow:0 2px 0 rgba(0,0,0,.08)}.filter{border-radius:12px;padding:10px 13px;background:#f0f0ed}.filter.active{background:var(--text);color:#fff}.list{display:grid;gap:14px}.match{--accent:var(--coral);background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}.match.away{--accent:var(--teal)}.match.past{opacity:.64}.match-head{padding:20px 22px 16px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.match-meta{font-size:13px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:5px}.match h2{margin:0;font-size:clamp(26px,4vw,38px);line-height:1;letter-spacing:-.035em}.location{margin:7px 0 0;color:var(--muted);font-weight:700}.type{flex:0 0 auto;background:color-mix(in srgb,var(--accent) 12%,white);border:1px solid color-mix(in srgb,var(--accent) 30%,white);border-radius:999px;padding:8px 11px;font-size:12px;font-weight:900;letter-spacing:.06em}.roles{border-top:1px solid var(--line)}.role{min-height:72px;padding:13px 22px;display:grid;grid-template-columns:150px 1fr auto;align-items:center;gap:12px;border-bottom:1px solid var(--line)}.role:last-child{border-bottom:0}.role-label{font-weight:900;font-size:16px}.name-input{width:100%;border:1px solid #d8d8d4;background:#fff;border-radius:11px;padding:11px 12px;color:var(--text);outline:none}.name-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}.name-input:disabled{background:#f4f4f1;color:var(--text);-webkit-text-fill-color:var(--text);opacity:1}.save{border-radius:11px;padding:10px 13px;background:var(--text);color:#fff}.action{border-radius:12px;padding:10px 13px;background:#f0f0ed}.past-toggle{width:100%;margin:18px 0 0;border-radius:14px;padding:13px 16px;background:#ececea}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(14px);opacity:0;pointer-events:none;background:#171717;color:#fff;border-radius:12px;padding:11px 14px;font-size:13px;font-weight:800;transition:.18s ease;z-index:30}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.hidden{display:none!important}@media(max-width:620px){.shell{width:100%;margin:0;padding:10px 10px 36px}.hero{border-radius:20px;padding:22px 18px 18px}h1{font-size:48px}.match{border-radius:18px}.match-head{padding:17px 16px 14px}.role{padding:12px 16px;grid-template-columns:1fr auto}.role-label{grid-column:1/-1}.name-input{min-width:0}}
</style>
</head>
<body>
<main class="shell">
<section class="hero"><div class="eyebrow">SEIZOEN 26–27 · BBC ALSEMBERG - RECREA</div><h1>Basketplanning</h1><div class="mode-nav"><a class="active" href="./">Tafel & delegé</a><a href="./speler/">Voor spelers</a><a href="./coach/">Voor de coach</a></div><div class="summary"><div class="open-count" id="openCount">Planning laden…</div><div class="filters"><button class="filter active" data-filter="all">Alle wedstrijden</button><button class="filter" data-filter="open">Nog hulp nodig</button></div></div></section>
<section class="list" id="matchList"></section>
<button class="past-toggle" id="pastToggle">Toon voorbije wedstrijden</button>
<section class="list hidden" id="pastList" style="margin-top:14px"></section>
</main>
<div class="toast" id="toast"></div>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbyXOnyblRkhAP9NZAZO7jFAFpsnWv1fCf_BkK4B2MC6HAnO3aoc7JLScEgAC5WgDF1LCQ/exec';
const matches=[{id:'2026-09-13',date:'ZO 13 SEPTEMBER',time:'16:00',place:'Beersel',type:'home',past:true,roles:['24sec','Tijdwaarnemer','Delegé']},{id:'2026-09-19',date:'ZA 19 SEPTEMBER',time:'18:30',place:'Halle',type:'away',roles:['Wedstrijdblad','Delegé']},{id:'2026-09-27',date:'ZO 27 SEPTEMBER',time:'16:00',place:'Beersel',type:'home',roles:['24sec','Tijdwaarnemer','Delegé']},{id:'2026-10-03',date:'ZA 3 OKTOBER',time:'20:00',place:'Dilbeek',type:'away',roles:['Wedstrijdblad','Delegé']},{id:'2026-10-11',date:'ZO 11 OKTOBER',time:'16:00',place:'Beersel',type:'home',roles:['24sec','Tijdwaarnemer','Delegé']},{id:'2026-10-18',date:'ZO 18 OKTOBER',time:'13:00',place:'Boortmeerbeek',type:'away',roles:['Wedstrijdblad','Delegé']},{id:'2026-10-25',date:'ZO 25 OKTOBER',time:'16:00',place:'Beersel',type:'home',roles:['24sec','Tijdwaarnemer','Delegé']},{id:'2026-11-15',date:'ZO 15 NOVEMBER',time:'13:00',place:'Machelen',type:'away',roles:['Wedstrijdblad','Delegé']},{id:'2026-11-22',date:'ZO 22 NOVEMBER',time:'16:00',place:'Beersel',type:'home',roles:['24sec','Tijdwaarnemer','Delegé']},{id:'2026-11-28',date:'ZA 28 NOVEMBER',time:'18:00',place:'Londerzeel',type:'away',roles:['Wedstrijdblad','Delegé']}];
let assignments={},filter='all',editKey=null,savingKey=null,loaded=false;
const slotKey=(id,role)=>`${id}::${role}`;
const safeId=s=>btoa(unescape(encodeURIComponent(s))).replace(/[^a-zA-Z0-9]/g,'');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#039;'}[c]));
function normalize(data){
  const out={};
  for(const [k,v] of Object.entries(data.assignments||{})) out[k]=typeof v==='string'?v:(v?.name||'');
  // Compatibiliteit met eerder ingevulde functies: oude namen blijven zichtbaar.
  for(const [k,name] of Object.entries({...out})){
    if(k.endsWith('::Klok')){
      const newKey=k.replace(/::Klok$/,'::24sec');
      if(!(newKey in out)) out[newKey]=name;
    }
    if(k.endsWith('::Tafelfunctie')){
      const newKey=k.replace(/::Tafelfunctie$/,'::Wedstrijdblad');
      if(!(newKey in out)) out[newKey]=name;
    }
    if(k.endsWith('::Scorebord')){
      const newKey=k.replace(/::Scorebord$/,'::Tijdwaarnemer');
      if(!(newKey in out)) out[newKey]=name;
    }
  }
  return out;
}
async function loadAssignments(showToast=true){try{const r=await fetch(`${API_URL}?action=load&t=${Date.now()}`,{cache:'no-store'});const d=await r.json();if(!d.ok)throw new Error(d.error||'Fout');assignments=normalize(d);loaded=true;render()}catch(e){console.error(e);loaded=true;document.getElementById('openCount').textContent='Niet verbonden';document.getElementById('matchList').innerHTML='<article class="match"><div class="match-head"><h2>Planning kon niet geladen worden.</h2></div></article>';if(showToast)toast('Kon planning niet laden')}}
function openSlots(m){return m.roles.filter(role=>!(assignments[slotKey(m.id,role)]||'').trim()).length}
function renderRole(m,role){const sk=slotKey(m.id,role),name=(assignments[sk]||'').trim(),editing=editKey===sk||!name;return `<div class="role"><div class="role-label">${role}</div><input class="name-input" id="input-${safeId(sk)}" value="${esc(name)}" placeholder="Naam" maxlength="40" ${editing?'':'disabled'} onkeydown="if(event.key==='Enter')saveName('${m.id}','${role}')">${editing?`<button class="save" onclick="saveName('${m.id}','${role}')">Bewaren</button>`:`<button class="action" onclick="beginEdit('${m.id}','${role}')">Wijzigen</button>`}</div>`}
function renderMatch(m){const n=openSlots(m);if(filter==='open'&&n===0&&!m.past)return'';return `<article class="match ${m.type==='away'?'away':''} ${m.past?'past':''}"><div class="match-head"><div><div class="match-meta">${m.date} · ${m.time}</div><h2>${m.place}</h2><div class="location">${n===0?'Alles ingevuld':`${n} ${n===1?'functie':'functies'} nog vrij`}</div></div><div class="type">${m.type==='home'?'THUIS':'UIT'}</div></div><div class="roles">${m.roles.map(r=>renderRole(m,r)).join('')}</div></article>`}
function render(){if(!loaded)return;const upcoming=matches.filter(m=>!m.past),past=matches.filter(m=>m.past);document.getElementById('matchList').innerHTML=upcoming.map(renderMatch).join('')||'<article class="match"><div class="match-head"><h2>Alles is ingevuld.</h2></div></article>';document.getElementById('pastList').innerHTML=past.map(renderMatch).join('');const total=upcoming.reduce((s,m)=>s+openSlots(m),0);document.getElementById('openCount').textContent=total?`${total} ${total===1?'plaats':'plaatsen'} nog open`:'Alles is ingevuld';document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter))}
function beginEdit(id,role){editKey=slotKey(id,role);render();requestAnimationFrame(()=>{const el=document.getElementById('input-'+safeId(editKey));if(el){el.disabled=false;el.focus();el.setSelectionRange(el.value.length,el.value.length)}})}
async function saveName(id,role){if(savingKey)return;const sk=slotKey(id,role),input=document.getElementById('input-'+safeId(sk)),name=(input?.value||'').trim(),btn=input?.parentElement?.querySelector('.save');savingKey=sk;if(btn){btn.disabled=true;btn.textContent='Bewaren…'}try{const u=new URL(API_URL);u.searchParams.set('action','save');u.searchParams.set('matchId',id);u.searchParams.set('role',role);u.searchParams.set('name',name);u.searchParams.set('t',Date.now());const r=await fetch(u.toString(),{cache:'no-store'});const d=await r.json();if(!d.ok||!d.saved)throw new Error(d.error||'Niet opgeslagen');assignments=normalize(d);editKey=null;render();toast('Bewaard')}catch(e){console.error(e);toast('Bewaren mislukt');if(btn){btn.disabled=false;btn.textContent='Bewaren'}}finally{savingKey=null}}
let toastTimer;function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1800)}
document.querySelectorAll('.filter').forEach(btn=>btn.addEventListener('click',()=>{filter=btn.dataset.filter;editKey=null;render()}));document.getElementById('pastToggle').addEventListener('click',e=>{const list=document.getElementById('pastList'),hidden=list.classList.toggle('hidden');e.currentTarget.textContent=hidden?'Toon voorbije wedstrijden':'Verberg voorbije wedstrijden'});loadAssignments();window.addEventListener('focus',()=>{if(!savingKey&&!document.querySelector('.name-input:focus'))loadAssignments(false)});setInterval(()=>{if(document.visibilityState==='visible'&&!savingKey&&!document.querySelector('.name-input:focus'))loadAssignments(false)},30000);
</script>
</body>
</html>

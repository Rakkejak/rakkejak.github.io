<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Basketplanning — Rakkejak</title>
<style>
:root{--bg:#f7f7f5;--panel:#fff;--text:#171717;--muted:#777b80;--line:#e5e5e2;--shadow:0 10px 30px rgba(0,0,0,.06);--coral:#e96a4a;--teal:#16a6a0;--danger:#c93d2e}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input{font:inherit}button{cursor:pointer}.shell{width:min(980px,94vw);margin:34px auto 60px}.hero{background:var(--panel);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);padding:30px 32px 26px;margin-bottom:18px}.eyebrow{font-size:13px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--coral);margin-bottom:9px}h1{margin:0;font-size:clamp(42px,7vw,76px);line-height:.95;letter-spacing:-.05em;font-weight:950}.summary{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:24px;padding-top:18px;border-top:1px solid var(--line);flex-wrap:wrap}.open-count{font-weight:900;font-size:18px}.filters{display:flex;gap:8px;flex-wrap:wrap}.filter{border:0;border-radius:12px;padding:10px 13px;background:#f0f0ed;color:var(--text);font-weight:850;box-shadow:0 2px 0 rgba(0,0,0,.08)}.filter.active{background:var(--text);color:#fff}.list{display:grid;gap:14px}.match{--accent:var(--coral);background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}.match.away{--accent:var(--teal)}.match.past{opacity:.64}.match-head{padding:20px 22px 16px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.match-meta{font-size:13px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:5px}.match h2{margin:0;font-size:clamp(26px,4vw,38px);line-height:1;letter-spacing:-.035em}.location{margin:7px 0 0;color:var(--muted);font-weight:700}.type{flex:0 0 auto;background:color-mix(in srgb,var(--accent) 12%,white);color:var(--text);border:1px solid color-mix(in srgb,var(--accent) 30%,white);border-radius:999px;padding:8px 11px;font-size:12px;font-weight:900;letter-spacing:.06em}.roles{border-top:1px solid var(--line)}.role{min-height:72px;padding:13px 22px;display:grid;grid-template-columns:150px 1fr auto;align-items:center;gap:12px;border-bottom:1px solid var(--line)}.role:last-child{border-bottom:0}.role-label{font-weight:900;font-size:16px}.action{border:0;border-radius:12px;padding:10px 13px;background:#f0f0ed;color:var(--text);font-weight:850;box-shadow:0 2px 0 rgba(0,0,0,.08);white-space:nowrap}.action.small{padding:8px 10px;font-size:13px}.name-input{width:100%;border:1px solid #d8d8d4;background:#fff;border-radius:11px;padding:11px 12px;color:var(--text);outline:none}.name-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}.name-input:disabled{background:#f4f4f1;color:var(--text);-webkit-text-fill-color:var(--text);opacity:1;cursor:default}.save{border:0;border-radius:11px;padding:10px 13px;background:var(--text);color:#fff;font-weight:900}.past-toggle{width:100%;margin:18px 0 0;border:0;border-radius:14px;padding:13px 16px;background:#ececea;color:var(--text);font-weight:900}.note{margin:18px 3px 0;color:var(--muted);font-size:13px;line-height:1.45}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(14px);opacity:0;pointer-events:none;background:#171717;color:#fff;border-radius:12px;padding:11px 14px;font-size:13px;font-weight:800;transition:.18s ease;z-index:30}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.hidden{display:none!important}@media(max-width:620px){.shell{width:100%;margin:0;padding:10px 10px 36px}.hero{border-radius:20px;padding:22px 18px 18px}h1{font-size:48px}.match{border-radius:18px}.match-head{padding:17px 16px 14px}.role{padding:12px 16px;grid-template-columns:1fr auto}.role-label{grid-column:1/-1}.name-input{min-width:0}.save,.action{width:auto}}
</style>
</head>
<body>
<main class="shell">
<section class="hero"><div class="eyebrow">SEIZOEN 26–27 · BBC ALSEMBERG - RECREA</div><h1>Basketplanning</h1><div class="summary"><div class="open-count" id="openCount"></div><div class="filters"><button class="filter active" data-filter="all">Alle wedstrijden</button><button class="filter" data-filter="open">Nog hulp nodig</button></div></div></section>
<section class="list" id="matchList"></section>
<button class="past-toggle" id="pastToggle">Toon voorbije wedstrijden</button>
<section class="list hidden" id="pastList" style="margin-top:14px"></section>
<p class="note">De ingevulde namen worden momenteel alleen op dit toestel bewaard.</p>
</main>
<div class="toast" id="toast">Bewaard</div>
<script>
const matches=[{id:"2026-09-13",date:"ZO 13 SEPTEMBER",time:"16:00",place:"Beersel",type:"home",past:true,roles:["Scorebord","Klok","Delegé"]},{id:"2026-09-19",date:"ZA 19 SEPTEMBER",time:"18:30",place:"Halle",type:"away",roles:["Tafelfunctie","Delegé"]},{id:"2026-09-27",date:"ZO 27 SEPTEMBER",time:"16:00",place:"Beersel",type:"home",roles:["Scorebord","Klok","Delegé"]},{id:"2026-10-03",date:"ZA 3 OKTOBER",time:"20:00",place:"Dilbeek",type:"away",roles:["Tafelfunctie","Delegé"]},{id:"2026-10-11",date:"ZO 11 OKTOBER",time:"16:00",place:"Beersel",type:"home",roles:["Scorebord","Klok","Delegé"]},{id:"2026-10-17",date:"ZA 17 OKTOBER",time:"21:00",place:"Boortmeerbeek",type:"away",roles:["Tafelfunctie","Delegé"]},{id:"2026-10-25",date:"ZO 25 OKTOBER",time:"16:00",place:"Beersel",type:"home",roles:["Scorebord","Klok","Delegé"]},{id:"2026-11-15",date:"ZO 15 NOVEMBER",time:"13:00",place:"Machelen",type:"away",roles:["Tafelfunctie","Delegé"]},{id:"2026-11-22",date:"ZO 22 NOVEMBER",time:"16:00",place:"Beersel",type:"home",roles:["Scorebord","Klok","Delegé"]},{id:"2026-11-28",date:"ZA 28 NOVEMBER",time:"18:00",place:"Londerzeel",type:"away",roles:["Tafelfunctie","Delegé"]}];
const key="rakkejak-basketplanning-v1";let assignments=JSON.parse(localStorage.getItem(key)||"{}");let filter="all";let editKey=null;function slotKey(matchId,role){return`${matchId}::${role}`}function persist(){localStorage.setItem(key,JSON.stringify(assignments))}function openSlots(match){return match.roles.filter(role=>!(assignments[slotKey(match.id,role)]||"").trim()).length}function safeId(s){return btoa(unescape(encodeURIComponent(s))).replace(/[^a-zA-Z0-9]/g,"")}function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function escapeAttr(s){return escapeHtml(s)}
function renderRole(match,role){const sk=slotKey(match.id,role);const name=(assignments[sk]||"").trim();const editing=editKey===sk||!name;const inputId="input-"+safeId(sk);return`<div class="role"><div class="role-label">${role}</div><input class="name-input" id="${inputId}" value="${escapeAttr(name)}" placeholder="Naam" maxlength="40" autocomplete="name" ${editing?"":"disabled"} onkeydown="handleKey(event,'${match.id}',${JSON.stringify(role)})">${editing?`<button class="save" onclick="saveName('${match.id}',${JSON.stringify(role)})">Bewaren</button>`:`<button class="action small" onclick="beginEdit('${match.id}',${JSON.stringify(role)})">Wijzigen</button>`}</div>`}
function renderMatch(match){const count=openSlots(match);if(filter==="open"&&count===0&&!match.past)return"";return`<article class="match ${match.type==="away"?"away":""} ${match.past?"past":""}"><div class="match-head"><div><div class="match-meta">${match.date} · ${match.time}</div><h2>${match.place}</h2><div class="location">${count===0?"Alles ingevuld":`${count} ${count===1?"functie":"functies"} nog vrij`}</div></div><div class="type">${match.type==="home"?"THUIS":"UIT"}</div></div><div class="roles">${match.roles.map(role=>renderRole(match,role)).join("")}</div></article>`}
function render(){const upcoming=matches.filter(m=>!m.past),past=matches.filter(m=>m.past);document.getElementById("matchList").innerHTML=upcoming.map(renderMatch).join("")||`<article class="match"><div class="match-head"><div><div class="match-meta">KLAAR</div><h2>Alles is ingevuld.</h2></div></div></article>`;document.getElementById("pastList").innerHTML=past.map(renderMatch).join("");const totalOpen=upcoming.reduce((sum,m)=>sum+openSlots(m),0);document.getElementById("openCount").textContent=totalOpen===0?"Alles is ingevuld":`${totalOpen} ${totalOpen===1?"plaats":"plaatsen"} nog open`;document.querySelectorAll(".filter").forEach(btn=>btn.classList.toggle("active",btn.dataset.filter===filter))}
function beginEdit(matchId,role){editKey=slotKey(matchId,role);render();requestAnimationFrame(()=>{const el=document.getElementById("input-"+safeId(editKey));if(el){el.focus();const len=el.value.length;el.setSelectionRange(len,len)}})}function saveName(matchId,role){const sk=slotKey(matchId,role),input=document.getElementById("input-"+safeId(sk)),value=(input?.value||"").trim();if(value)assignments[sk]=value;else delete assignments[sk];persist();editKey=null;render();toast("Bewaard")}function handleKey(event,matchId,role){if(event.key==="Enter")saveName(matchId,role)}let toastTimer;function toast(message){const el=document.getElementById("toast");el.textContent=message;el.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove("show"),1200)}document.querySelectorAll(".filter").forEach(btn=>btn.addEventListener("click",()=>{filter=btn.dataset.filter;editKey=null;render()}));const pastToggle=document.getElementById("pastToggle");pastToggle.addEventListener("click",()=>{const list=document.getElementById("pastList"),hidden=list.classList.toggle("hidden");pastToggle.textContent=hidden?"Toon voorbije wedstrijden":"Verberg voorbije wedstrijden"});render();
</script>
</body>
</html>

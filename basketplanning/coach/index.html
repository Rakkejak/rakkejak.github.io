<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Voor de coach — Basketplanning</title><style>
:root{--bg:#f7f7f5;--panel:#fff;--text:#171717;--muted:#777b80;--line:#e5e5e2;--shadow:0 10px 30px rgba(0,0,0,.06);--coral:#e96a4a;--teal:#16a6a0;--green:#24945d;--red:#d95b4d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{width:min(980px,94vw);margin:28px auto 60px}.card{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:26px;margin-bottom:16px}.eyebrow{font-size:13px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--coral);margin-bottom:8px}h1{font-size:clamp(42px,8vw,72px);line-height:.95;letter-spacing:-.05em;margin:0}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}.nav a{display:inline-block;border-radius:12px;padding:11px 14px;background:#efefec;color:#171717;text-decoration:none;font-weight:900;box-shadow:0 2px 0 rgba(0,0,0,.08)}.nav a.active{background:#171717;color:#fff}.match{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}.head{padding:18px 20px}.meta{font-size:13px;font-weight:900;letter-spacing:.08em;color:var(--teal);text-transform:uppercase}.match.home .meta{color:var(--coral)}h2{font-size:32px;margin:3px 0 0}.groups{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}.group{padding:18px 20px;min-height:120px}.group+.group{border-left:1px solid var(--line)}.label{font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}.yes .label{color:var(--green)}.no .label{color:var(--red)}.pending .label{color:var(--muted)}.names{font-weight:750;line-height:1.45}.count{font-size:13px;color:var(--muted);margin-top:5px}.loading{color:var(--muted);font-weight:800}@media(max-width:700px){.shell{width:100%;margin:0;padding:10px}.card{border-radius:20px;padding:20px}.groups{grid-template-columns:1fr}.group+.group{border-left:0;border-top:1px solid var(--line)}}
</style></head><body><main class="shell"><section class="card"><div class="eyebrow">SEIZOEN 26–27 · BBC ALSEMBERG - RECREA</div><h1>Voor de coach</h1><div class="nav"><a href="../">Tafel & delegé</a><a href="../speler/">Voor spelers</a><a class="active" href="./">Voor de coach</a></div></section><section id="overview"><div class="card loading">Beschikbaarheid laden…</div></section></main><script>
const API='https://script.google.com/macros/s/AKfycbyXOnyblRkhAP9NZAZO7jFAFpsnWv1fCf_BkK4B2MC6HAnO3aoc7JLScEgAC5WgDF1LCQ/exec';
const matches=[{id:'2026-09-19',date:'ZA 19 SEPTEMBER',time:'18:30',place:'Halle',type:'away'},{id:'2026-09-27',date:'ZO 27 SEPTEMBER',time:'16:00',place:'Beersel',type:'home'},{id:'2026-10-03',date:'ZA 3 OKTOBER',time:'20:00',place:'Dilbeek',type:'away'},{id:'2026-10-11',date:'ZO 11 OKTOBER',time:'16:00',place:'Beersel',type:'home'},{id:'2026-10-18',date:'ZO 18 OKTOBER',time:'13:00',place:'Boortmeerbeek',type:'away'},{id:'2026-10-25',date:'ZO 25 OKTOBER',time:'16:00',place:'Beersel',type:'home'},{id:'2026-11-15',date:'ZO 15 NOVEMBER',time:'13:00',place:'Machelen',type:'away'},{id:'2026-11-22',date:'ZO 22 NOVEMBER',time:'16:00',place:'Beersel',type:'home'},{id:'2026-11-28',date:'ZA 28 NOVEMBER',time:'18:00',place:'Londerzeel',type:'away'}];
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function todayId(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
async function load(){try{const u=new URL(API);u.searchParams.set('action','coachOverview');u.searchParams.set('t',Date.now());const d=await (await fetch(u,{cache:'no-store'})).json();if(!d.ok)throw new Error(d.error||'Fout');const players=d.players||[];const availability=d.availability||{};document.getElementById('overview').innerHTML=matches.filter(m=>m.id>=todayId()).map(m=>{const can=[],cannot=[],pending=[];for(const p of players){const v=(availability[p.playerId]||{})[m.id];if(v==='kan')can.push(p.name);else if(v==='kan_niet')cannot.push(p.name);else pending.push(p.name)}return `<article class="match ${m.type==='home'?'home':''}"><div class="head"><div class="meta">${m.date} · ${m.time}</div><h2>${m.place}</h2></div><div class="groups"><div class="group yes"><div class="label">Kan</div><div class="names">${can.length?can.map(esc).join('<br>'):'—'}</div><div class="count">${can.length} speler${can.length===1?'':'s'}</div></div><div class="group no"><div class="label">Kan niet</div><div class="names">${cannot.length?cannot.map(esc).join('<br>'):'—'}</div><div class="count">${cannot.length} speler${cannot.length===1?'':'s'}</div></div><div class="group pending"><div class="label">Nog niet ingevuld</div><div class="names">${pending.length?pending.map(esc).join('<br>'):'—'}</div><div class="count">${pending.length} speler${pending.length===1?'':'s'}</div></div></div></article>`}).join('')}catch(e){console.error(e);document.getElementById('overview').innerHTML='<div class="card">Kon de beschikbaarheid niet laden.</div>'}}
load();setInterval(load,30000);
</script></body></html>

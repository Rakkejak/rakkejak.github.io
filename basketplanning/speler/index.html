<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Voor spelers — Basketplanning</title><style>
:root{--bg:#f7f7f5;--panel:#fff;--text:#171717;--muted:#777b80;--line:#e5e5e2;--shadow:0 10px 30px rgba(0,0,0,.06);--coral:#e96a4a;--teal:#16a6a0;--green:#24945d;--red:#d95b4d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{width:min(900px,94vw);margin:28px auto 60px}.card{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:26px;margin-bottom:16px}.eyebrow{font-size:13px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--coral);margin-bottom:8px}h1{font-size:clamp(42px,8vw,72px);line-height:.95;letter-spacing:-.05em;margin:0}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}.nav a,.btn{display:inline-block;border:0;border-radius:12px;padding:11px 14px;background:#efefec;color:#171717;text-decoration:none;font-weight:900;box-shadow:0 2px 0 rgba(0,0,0,.08)}.nav a.active,.btn.primary{background:#171717;color:white}.name-row{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:18px}.name-row input{width:100%;padding:14px;border:1px solid #d8d8d4;border-radius:12px;font-size:18px}.match{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}.head{padding:18px 20px}.meta{font-size:13px;font-weight:900;letter-spacing:.08em;color:var(--teal);text-transform:uppercase}.match.home .meta{color:var(--coral)}h2{font-size:32px;margin:3px 0 0}.choices{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}.choice{border:0;padding:17px 12px;background:#fff;font-weight:900;font-size:17px}.choice+ .choice{border-left:1px solid var(--line)}.choice.can.selected{background:#e9f6ef;color:#176a43}.choice.cannot.selected{background:#faece9;color:#9a392e}.choice:disabled{cursor:default}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.message{margin-top:14px;padding:14px;border-radius:12px;background:#f1f1ee;display:none}.message.show{display:block}.permalink{word-break:break-all;font-weight:800}.muted{color:var(--muted)}@media(max-width:600px){.shell{width:100%;margin:0;padding:10px}.card{border-radius:20px;padding:20px}.name-row{grid-template-columns:1fr}.choices{grid-template-columns:1fr 1fr}}
</style></head><body><main class="shell">
<section class="card"><div class="eyebrow">SEIZOEN 26–27 · BBC ALSEMBERG - RECREA</div><h1>Voor spelers</h1><div class="nav"><a href="../">Tafel & delegé</a><a class="active" href="./">Voor spelers</a><a href="../coach/">Voor de coach</a></div><div class="name-row"><input id="playerName" placeholder="Geef je voornaam en familienaam" maxlength="60"><button class="btn" id="nameEdit" style="display:none">Wijzigen</button></div></section>
<section id="matches"></section>
<section class="card"><div class="actions"><button class="btn primary" id="saveBtn">Bewaren</button><button class="btn" id="editBtn" style="display:none">Wijzigen</button></div><div class="message" id="savedMessage"><strong>Je beschikbaarheid is bewaard.</strong><div class="muted" style="margin-top:6px">Bewaar deze link als je later iets wilt wijzigen:</div><div class="permalink" id="permalink"></div><button class="btn" id="copyBtn" style="margin-top:10px">Kopieer link</button></div></section>
</main><script>
const API='https://script.google.com/macros/s/AKfycbyXOnyblRkhAP9NZAZO7jFAFpsnWv1fCf_BkK4B2MC6HAnO3aoc7JLScEgAC5WgDF1LCQ/exec';
const matches=[{id:'2026-09-19',date:'ZA 19 SEPTEMBER',time:'18:30',place:'Halle',type:'away'},{id:'2026-09-27',date:'ZO 27 SEPTEMBER',time:'16:00',place:'Beersel',type:'home'},{id:'2026-10-03',date:'ZA 3 OKTOBER',time:'20:00',place:'Dilbeek',type:'away'},{id:'2026-10-11',date:'ZO 11 OKTOBER',time:'16:00',place:'Beersel',type:'home'},{id:'2026-10-18',date:'ZO 18 OKTOBER',time:'13:00',place:'Boortmeerbeek',type:'away'},{id:'2026-10-25',date:'ZO 25 OKTOBER',time:'16:00',place:'Beersel',type:'home'},{id:'2026-11-15',date:'ZO 15 NOVEMBER',time:'13:00',place:'Machelen',type:'away'},{id:'2026-11-22',date:'ZO 22 NOVEMBER',time:'16:00',place:'Beersel',type:'home'},{id:'2026-11-28',date:'ZA 28 NOVEMBER',time:'18:00',place:'Londerzeel',type:'away'}];
let playerId=decodeURIComponent(location.hash.replace(/^#/,''));let statuses={};let locked=false;
function slugify(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
function render(){document.getElementById('matches').innerHTML=matches.map(m=>`<article class="match ${m.type==='home'?'home':''}"><div class="head"><div class="meta">${m.date} · ${m.time}</div><h2>${m.place}</h2></div><div class="choices"><button class="choice can ${statuses[m.id]==='kan'?'selected':''}" data-id="${m.id}" data-v="kan" ${locked?'disabled':''}>Ik kan</button><button class="choice cannot ${statuses[m.id]==='kan_niet'?'selected':''}" data-id="${m.id}" data-v="kan_niet" ${locked?'disabled':''}>Ik kan niet</button></div></article>`).join('');document.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{statuses[b.dataset.id]=b.dataset.v;render()}));document.getElementById('playerName').disabled=locked;document.getElementById('saveBtn').style.display=locked?'none':'inline-block';document.getElementById('editBtn').style.display=locked?'inline-block':'none'}
function normalizePlayerId(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').replace(/[^a-z0-9]/g,'')}
async function loadPlayer(){if(!playerId){render();return}try{
  const u=new URL(API);u.searchParams.set('action','loadPlayer');u.searchParams.set('playerId',playerId);u.searchParams.set('t',Date.now());
  const d=await (await fetch(u,{cache:'no-store'})).json();
  if(d.ok&&d.player){
    document.getElementById('playerName').value=d.player.name||'';
    statuses=d.availability||{};
    playerId=d.player.playerId||playerId;
    locked=true;showLink();render();return;
  }
}catch(e){console.warn('loadPlayer fallback:',e)}
try{
  const u=new URL(API);u.searchParams.set('action','coachOverview');u.searchParams.set('t',Date.now());
  const d=await (await fetch(u,{cache:'no-store'})).json();
  if(d.ok){
    const wanted=normalizePlayerId(playerId);
    const p=(d.players||[]).find(x=>normalizePlayerId(x.playerId)===wanted);
    if(p){
      playerId=p.playerId;
      if(location.hash!=='#'+encodeURIComponent(playerId)) history.replaceState(null,'',location.pathname+location.search+'#'+encodeURIComponent(playerId));
      document.getElementById('playerName').value=p.name||'';
      statuses=(d.availability||{})[p.playerId]||{};
      locked=true;showLink();render();return;
    }
  }
}catch(e){console.error(e)}
render()}
async function save(){const name=document.getElementById('playerName').value.trim();if(!name){alert('Vul eerst je naam in.');return}if(!playerId){playerId=slugify(name)||'speler';location.hash=encodeURIComponent(playerId)}const b=document.getElementById('saveBtn');b.disabled=true;b.textContent='Bewaren…';try{const u=new URL(API);u.searchParams.set('action','savePlayer');u.searchParams.set('playerId',playerId);u.searchParams.set('name',name);u.searchParams.set('availability',JSON.stringify(statuses));u.searchParams.set('t',Date.now());const d=await (await fetch(u,{cache:'no-store'})).json();if(!d.ok)throw new Error(d.error||'Fout');locked=true;render();showLink()}catch(e){console.error(e);alert('Bewaren mislukt. Probeer opnieuw.')}finally{b.disabled=false;b.textContent='Bewaren'}}
function showLink(){const link=`${location.origin}/basketplanning/speler/#${encodeURIComponent(playerId)}`;document.getElementById('permalink').textContent=link;document.getElementById('savedMessage').classList.add('show')}
document.getElementById('saveBtn').onclick=save;document.getElementById('editBtn').onclick=()=>{locked=false;render()};document.getElementById('copyBtn').onclick=async()=>{await navigator.clipboard.writeText(document.getElementById('permalink').textContent);document.getElementById('copyBtn').textContent='Gekopieerd'};render();loadPlayer();
</script></body></html>

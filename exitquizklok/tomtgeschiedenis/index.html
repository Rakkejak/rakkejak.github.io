<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EXIT QUIZ KLOK — TomTgeschiedenis</title><style>:root{--bg:#f4f4f1;--card:#fff;--ink:#171717;--muted:#777;--line:#deded9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}.app{max-width:980px;margin:0 auto;padding:28px 20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}h1{font-size:28px;margin:0;letter-spacing:.04em}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px}.clock{font-size:58px;font-weight:700;font-variant-numeric:tabular-nums}.date,.muted{color:var(--muted)}.title{font-size:15px;font-weight:700;margin:20px 0 8px}.lesson{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}.lesson:first-child{border-top:0}.next{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:14px 0;font-size:14px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,input{border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px 13px;font:inherit}button{font-weight:700;cursor:pointer}.primary{background:#171717;color:#fff;border-color:#171717}.timer{text-align:center;font-size:62px;font-weight:700;font-variant-numeric:tabular-nums;margin:24px 0}.overlay{display:none;position:fixed;inset:0;background:#111;color:#fff;padding:34px;z-index:99}.overlay.show{display:block}.ow{max-width:1100px;margin:0 auto}.otop{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.otitle{font-size:42px;font-weight:800}.questions{display:grid;gap:14px}.q{background:#fff;color:#111;border-radius:12px;padding:22px;font-size:clamp(22px,3vw,36px);font-weight:700;line-height:1.25}@media(max-width:760px){.grid{grid-template-columns:1fr}.clock{font-size:48px}}</style></head><body><main class="app"><div class="top"><h1>EXIT QUIZ KLOK</h1><div class="row"><button id="rooster">Lesrooster aanpassen</button><button id="vragen">Vragen aanpassen</button></div></div><div class="grid"><section class="card"><div id="clock" class="clock">--:--:--</div><div id="date" class="date"></div><div class="title">Lesrooster vandaag</div><div id="schedule"></div><div id="next" class="next"></div><div class="row"><button id="arm" class="primary">Alarm aan</button><button id="test">Test exit-slip</button></div></section><section class="card"><div class="title" style="margin-top:0">Quiztimer</div><div class="row"><button data-s="60">1 min</button><button data-s="180">3 min</button><button data-s="300">5 min</button><button data-s="600">10 min</button></div><div id="tdisplay" class="timer">02:00</div><div class="row" style="justify-content:center"><button id="tstart" class="primary">Start</button><button id="treset">Reset</button></div></section></div></main><div id="overlay" class="overlay"><div class="ow"><div class="otop"><div><div class="otitle">EXIT SLIP</div><div class="muted">Nog 5 minuten</div></div><button id="close">Sluiten</button></div><div class="questions"><div class="q">1. Welk idee zul je zeker onthouden over de les van vandaag?</div><div class="q">2. Welke vraag heb je nog? Of wat was het minst duidelijk?</div><div id="q3" class="q">3. Leg de les uit aan iemand van 12 jaar in één zin.</div></div></div></div><script>(()=>{const schedule={5:[['11:30','12:20'],['12:20','13:10']]};const clock=document.getElementById('clock'),date=document.getElementById('date'),sched=document.getElementById('schedule'),next=document.getElementById('next'),ov=document.getElementById('overlay'),q3=document.getElementById('q3');let audio=null,armed=false;const fired=new Set();const M=t=>{const[a,b]=t.split(':').map(Number);return a*60+b};function weekVariant(d){const a=new Date(2026,8,4),c=new Date(d.getFullYear(),d.getMonth(),d.getDate());return Math.abs(Math.floor((c-a)/(604800000)))%2===0?'explain':'test'}function ensure(){audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();armed=true;document.getElementById('arm').textContent='Alarm actief'}function beep(){if(!armed||!audio)return;const n=audio.currentTime;[0,.34,.68].forEach(o=>{const x=audio.createOscillator(),g=audio.createGain();x.frequency.value=880;g.gain.setValueAtTime(.0001,n+o);g.gain.exponentialRampToValueAtTime(.3,n+o+.02);g.gain.exponentialRampToValueAtTime(.0001,n+o+.24);x.connect(g);g.connect(audio.destination);x.start(n+o);x.stop(n+o+.26)})}function exit(){beep();q3.textContent=weekVariant(new Date())==='explain'?'3. Leg de les uit aan iemand van 12 jaar in één zin.':'3. Bedenk één goede toetsvraag over de les.';ov.classList.add('show');try{window.focus()}catch(e){}}function render(){const n=new Date();clock.textContent=n.toLocaleTimeString('nl-BE',{hour12:false});date.textContent=n.toLocaleDateString('nl-BE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});const ls=schedule[n.getDay()]||[];sched.innerHTML=ls.length?ls.map(l=>{const a=M(l[1])-5;return `<div class="lesson"><span>${l[0]}–${l[1]}</span><span class="muted">alarm ${String(Math.floor(a/60)).padStart(2,'0')}:${String(a%60).padStart(2,'0')}</span></div>`}).join(''):'<div class="muted">Geen lessen ingesteld.</div>';const nm=n.getHours()*60+n.getMinutes(),f=ls.map(l=>({l,a:M(l[1])-5})).find(x=>x.a>nm);next.textContent=f?`Volgende exit-slip: ${String(Math.floor(f.a/60)).padStart(2,'0')}:${String(f.a%60).padStart(2,'0')}`:'Geen exit-slip meer vandaag.';const sec=n.getHours()*3600+n.getMinutes()*60+n.getSeconds();ls.forEach(l=>{const a=(M(l[1])-5)*60,key=n.toDateString()+l[1];if(sec>=a&&sec<a+600&&!fired.has(key)){fired.add(key);exit()}})}document.getElementById('arm').onclick=()=>{ensure();beep()};document.getElementById('test').onclick=()=>{if(!armed)ensure();exit()};document.getElementById('close').onclick=()=>ov.classList.remove('show');document.getElementById('rooster').onclick=()=>alert('In de definitieve versie vraagt aanpassen opnieuw Smartschool-login.');document.getElementById('vragen').onclick=()=>alert('In de definitieve versie vraagt aanpassen opnieuw Smartschool-login.');let sel=120,rem=120,run=false,end=null,tick=null;const td=document.getElementById('tdisplay'),ts=document.getElementById('tstart');const fmt=s=>{s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};function setT(s){clearInterval(tick);run=false;sel=rem=s;ts.textContent='Start';td.textContent=fmt(rem)}document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>setT(+b.dataset.s));document.getElementById('treset').onclick=()=>setT(sel);ts.onclick=()=>{if(!armed)ensure();if(!run){if(rem<=0)rem=sel;run=true;end=Date.now()+rem*1000;ts.textContent='Pauze';tick=setInterval(()=>{rem=Math.max(0,(end-Date.now())/1000);td.textContent=fmt(rem);if(rem<=0){clearInterval(tick);run=false;ts.textContent='Start';beep();alert('TIJD!')}},200)}else{rem=Math.max(0,(end-Date.now())/1000);clearInterval(tick);run=false;ts.textContent='Verder';td.textContent=fmt(rem)}};render();setInterval(render,1000)})();</script></body></html>

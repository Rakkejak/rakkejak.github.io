<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EXIT QUIZ KLOK — Timer</title><style>body{margin:0;background:#f4f4f1;color:#171717;font-family:Arial,Helvetica,sans-serif}.wrap{max-width:760px;margin:0 auto;padding:48px 20px;text-align:center}h1{font-size:28px;letter-spacing:.04em}.timer{font-size:min(22vw,150px);font-weight:700;font-variant-numeric:tabular-nums;margin:56px 0 36px}.row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}button,input{font:inherit;border:1px solid #deded9;background:#fff;border-radius:10px;padding:12px 16px}button{font-weight:700;cursor:pointer}button.primary{background:#171717;color:#fff;border-color:#171717}input{width:90px}.timeup{display:none;position:fixed;inset:0;background:#111;color:#fff;align-items:center;justify-content:center;font-size:min(20vw,140px);font-weight:800}.timeup.show{display:flex}</style></head><body><main class="wrap"><h1>QUIZTIMER</h1><div class="row"><button data-s="60">1 min</button><button data-s="180">3 min</button><button data-s="300">5 min</button><button data-s="600">10 min</button></div><div class="row" style="margin-top:12px"><input id="mins" type="number" min="0" value="2"><button id="custom">Instellen</button></div><div id="display" class="timer">02:00</div><div class="row"><button id="start" class="primary">Start</button><button id="reset">Reset</button></div></main><div id="timeup" class="timeup">TIJD!</div><script>(()=>{let selected=120,remaining=120,running=false,endAt=null,tick=null,audio=null;const d=document.getElementById('display'),start=document.getElementById('start'),timeup=document.getElementById('timeup');function fmt(s){s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function render(){d.textContent=fmt(remaining)}function set(s){clearInterval(tick);running=false;selected=remaining=Math.max(0,s);start.textContent='Start';render()}function beep(){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();const n=audio.currentTime;[0,.3,.6].forEach(o=>{const osc=audio.createOscillator(),g=audio.createGain();osc.frequency.value=880;g.gain.setValueAtTime(.0001,n+o);g.gain.exponentialRampToValueAtTime(.3,n+o+.02);g.gain.exponentialRampToValueAtTime(.0001,n+o+.22);osc.connect(g);g.connect(audio.destination);osc.start(n+o);osc.stop(n+o+.24)})}catch(e){}}document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>set(+b.dataset.s));document.getElementById('custom').onclick=()=>set((+document.getElementById('mins').value||0)*60);document.getElementById('reset').onclick=()=>set(selected);start.onclick=()=>{if(!running){audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(remaining<=0)remaining=selected;running=true;endAt=Date.now()+remaining*1000;start.textContent='Pauze';tick=setInterval(()=>{remaining=Math.max(0,(endAt-Date.now())/1000);render();if(remaining<=0){clearInterval(tick);running=false;start.textContent='Start';beep();timeup.classList.add('show')}},200)}else{remaining=Math.max(0,(endAt-Date.now())/1000);clearInterval(tick);running=false;start.textContent='Verder';render()}};timeup.onclick=()=>timeup.classList.remove('show');render()})();</script></body></html>

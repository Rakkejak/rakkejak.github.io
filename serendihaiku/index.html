<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Serendihaiku — ongeplande haiku's, gevonden op de vreemdste plekken.">
  <title>Serendihaiku — Rakkejak</title>
  <style>
    :root{--paper:#f2f0e9;--ink:#11110f;--accent:#ff4d00;--muted:#66625b}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
    a{color:inherit}
    .page{min-height:100svh;padding:28px clamp(22px,5vw,72px) 54px}
    .topbar{display:flex;justify-content:space-between;align-items:center;gap:20px}
    .brand{font-size:clamp(1.25rem,2vw,1.7rem);font-weight:800;letter-spacing:-.06em;text-decoration:none}
    .brand:after{content:"";display:inline-block;width:.36em;height:.36em;margin-left:.28em;border-radius:50%;background:var(--accent);vertical-align:.08em}
    .back{font-size:.85rem;font-weight:800;text-decoration:none;border-bottom:1.5px solid currentColor;padding-bottom:3px}

    .hero{min-height:calc(100svh - 90px);display:flex;align-items:center;justify-content:center;padding:44px 0 56px}
    .haiku-wrap{width:min(1120px,100%)}
    .eyebrow{margin:0 0 34px;color:var(--accent);font-size:.72rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase}
    .haiku-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:30px}
    .haiku{margin:0;width:100%;font-size:100px;line-height:.88;letter-spacing:-.065em;font-weight:650;min-width:0}
    .haiku-line{display:block;width:100%;max-width:100%;opacity:0;transform:translateY(18px);white-space:nowrap;overflow:visible;word-break:normal}
    .haiku-line + .haiku-line{margin-top:.24em}

    .next-symbol{width:58px;height:58px;border:2px solid var(--ink);border-radius:50%;background:transparent;color:var(--ink);font-size:2rem;line-height:1;cursor:pointer;display:grid;place-items:center;transition:.18s;flex:none}
    .next-symbol:hover,.next-symbol:focus-visible{background:var(--accent);border-color:var(--accent);transform:translateX(3px)}
    .haiku-actions{display:flex;justify-content:space-between;align-items:center;gap:24px;margin-top:42px}
    .replay,.continue,.source-jump{width:fit-content;border:0;border-bottom:2px solid var(--ink);background:none;padding:0 0 6px;font:inherit;font-size:1rem;font-weight:800;cursor:pointer;color:var(--ink);text-decoration:none}
    .replay:hover,.replay:focus-visible,.continue:hover,.continue:focus-visible,.source-jump:hover,.source-jump:focus-visible{color:var(--accent);border-color:var(--accent)}

    .analysis{padding:clamp(58px,8vw,110px) 0;border-top:1px solid rgba(17,17,15,.25)}
    .analysis-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(320px,.95fr);gap:clamp(50px,8vw,120px);align-items:start}
    .count-list{display:grid;gap:22px;margin-top:30px}
    .count-row{display:grid;grid-template-columns:48px 1fr;align-items:baseline;gap:10px;font-size:clamp(1.3rem,2.3vw,2rem)}
    .count-row strong{font-size:1em}.count-row sup{font-size:.55em;font-weight:700;vertical-align:super;margin-left:1px}
    .found{background:var(--ink);color:var(--paper);padding:clamp(28px,4vw,46px);border-radius:2px}
    .found-label{margin:0 0 16px;color:var(--accent);font-size:.7rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase}
    .found h2{margin:0;font-size:clamp(2rem,4.2vw,4.5rem);line-height:.96;letter-spacing:-.055em;font-weight:650}
    .source-jump-row{display:flex;justify-content:flex-end;margin-top:28px}

    .source{padding:clamp(70px,9vw,120px) 0 20px;scroll-margin-top:28px}
    .source-title{margin:0 0 28px;font-size:.85rem;font-weight:900;letter-spacing:.16em;text-transform:uppercase}
    .source-links{display:flex;flex-wrap:wrap;gap:18px 28px;margin-bottom:34px}
    .source-links a{font-size:clamp(1.05rem,2vw,1.45rem);text-underline-offset:5px}
    .passport{border-top:1px solid rgba(17,17,15,.18);border-bottom:1px solid rgba(17,17,15,.18);padding:20px 0;display:grid;grid-template-columns:240px 1fr;gap:10px 28px;max-width:1050px;color:var(--muted);font-size:clamp(.95rem,1.4vw,1.08rem)}
    .passport dt{font-weight:800}.passport dd{margin:0;overflow-wrap:anywhere}
    .next{margin-top:60px;display:flex;justify-content:flex-end}.next button{border:0;background:var(--accent);color:var(--ink);padding:16px 20px;font:inherit;font-weight:900;cursor:pointer}

    @media(max-width:760px){
      .hero{min-height:72svh;padding-top:70px}
      .haiku-row{grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:end}
      .next-symbol{width:46px;height:46px;font-size:1.55rem;margin-bottom:4px}
      .haiku-actions{align-items:flex-start;flex-direction:column;gap:20px;margin-top:34px}
      .haiku-line + .haiku-line{margin-top:.3em}
      .analysis-grid{grid-template-columns:1fr}.passport{grid-template-columns:1fr;gap:4px}.passport dd{margin-bottom:10px}.count-row{grid-template-columns:36px 1fr}.source-links{flex-direction:column;gap:12px}
    }
    @media(prefers-reduced-motion:reduce){.haiku-line{opacity:1;transform:none}}
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar"><a class="brand" href="/serendihaiku/">Serendihaiku</a><a class="back" href="/">rakkejak ↗</a></header>

    <section class="hero" aria-labelledby="haiku-title">
      <div class="haiku-wrap">
        <p class="eyebrow">ongeplande Haiku, gevonden op de vreemdste plekken</p>
        <div class="haiku-row">
          <h1 class="haiku" id="haiku-title">
            <span class="haiku-line"></span>
            <span class="haiku-line"></span>
            <span class="haiku-line"></span>
          </h1>
          <button class="next-symbol" id="nextSymbol" type="button" aria-label="Volgende haiku">→</button>
        </div>
        <div class="haiku-actions">
          <button class="replay" id="replayBtn" type="button">opnieuw ↻</button>
          <button class="continue" id="continueBtn" type="button">bekijk waarom dit een haiku is ↓</button>
        </div>
      </div>
    </section>

    <section class="analysis" id="analyse" aria-labelledby="analyse-title">
      <div class="analysis-grid">
        <div><p class="eyebrow" id="analyse-title">5 · 7 · 5</p><div class="count-list" id="countList" aria-label="Lettergreeptelling"></div></div>
        <aside class="found"><p class="found-label">serendipiteit</p><h2>Gevonden in een openbaar gedeelde ChatGPT-chat.</h2></aside>
      </div>
      <div class="source-jump-row"><a class="source-jump" href="#bron">bron ↓</a></div>
    </section>

    <section class="source" id="bron" aria-labelledby="source-title">
      <h2 class="source-title" id="source-title">Bron</h2>
      <nav class="source-links" aria-label="Bronlinks"><a id="chatLink" target="_blank" rel="noopener noreferrer">Originele gedeelde ChatGPT-chat ↗</a><a id="datasetLink" target="_blank" rel="noopener noreferrer">Dataset ↗</a></nav>
      <dl class="passport" id="passport"></dl>
      <div class="next"><button type="button" id="nextBottom">volgende haiku →</button></div>
    </section>
  </main>

  <script>
    const DATASET_URL='https://huggingface.co/datasets/anoynsharechat/sharechat/viewer/chatgpt/train';
    const haikuEl=document.getElementById('haiku-title');
    const lines=[...document.querySelectorAll('.haiku-line')];
    let animations=[];let haikus=[];let index=0;
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    function cancelPoemAnimation(){animations.forEach(a=>a.cancel());animations=[];lines.forEach(line=>{line.style.opacity='0';line.style.transform='translateY(18px)'})}
    function playPoem(){cancelPoemAnimation();if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){lines.forEach(line=>{line.style.opacity='1';line.style.transform='none'});return}lines.forEach((line,i)=>{animations.push(line.animate([{opacity:0,transform:'translateY(18px)'},{opacity:1,transform:'translateY(0)'}],{duration:560,delay:350+(i*1050),easing:'cubic-bezier(.2,.75,.25,1)',fill:'forwards'}))})}

    function linesFit(){return lines.every(line=>line.scrollWidth<=line.clientWidth+1)}

    function fitHaiku(){
      if(!haikuEl.clientWidth)return;
      const viewportW=window.innerWidth;
      const maxSize=viewportW<760?Math.min(66,viewportW*.13):Math.min(108,viewportW*.062);
      const minSize=viewportW<760?18:30;
      let low=minSize,high=maxSize,best=minSize;

      haikuEl.style.fontSize=minSize+'px';
      for(let n=0;n<16;n++){
        const mid=(low+high)/2;
        haikuEl.style.fontSize=mid+'px';
        if(linesFit()){best=mid;low=mid}else{high=mid}
      }
      haikuEl.style.fontSize=best+'px';

      if(!linesFit()){
        const ratios=lines.map(line=>line.scrollWidth?line.clientWidth/line.scrollWidth:1);
        const ratio=Math.min(...ratios,1);
        haikuEl.style.fontSize=Math.max(14,best*ratio*.985)+'px';
      }
    }

    function render(){
      const h=haikus[index];if(!h)return;
      cancelPoemAnimation();h.l.forEach((t,i)=>lines[i].textContent=t);
      document.getElementById('countList').innerHTML=h.b.map((row,i)=>`<div class="count-row"><strong>${[5,7,5][i]}:</strong><span>${row.map(([w,n])=>`${esc(w)}<sup>${n}</sup>`).join(' &nbsp; ')}</span></div>`).join('');
      document.getElementById('chatLink').href=h.url;document.getElementById('datasetLink').href=DATASET_URL;
      document.getElementById('passport').innerHTML=`<dt>Herkomst</dt><dd>AI</dd><dt>Taal haiku</dt><dd>nl</dd><dt>Dataset</dt><dd>anoynsharechat/sharechat</dd><dt>Dataset-rij</dt><dd>${h.row}</dd><dt>Bericht-index</dt><dd>${h.mi}</dd><dt>Model</dt><dd>${esc(h.m)}</dd><dt>Berichttijd</dt><dd>${esc(h.mt)}</dd><dt>Chat aangemaakt</dt><dd>${esc(h.ct)}</dd><dt>SHA-256 bronbericht</dt><dd>${esc(h.sha)}</dd>`;
      requestAnimationFrame(()=>{fitHaiku();requestAnimationFrame(playPoem)});
    }

    function nextHaiku(){if(!haikus.length)return;index=(index+1)%haikus.length;window.scrollTo({top:0,behavior:'smooth'});render()}
    document.getElementById('replayBtn').addEventListener('click',playPoem);
    document.getElementById('nextSymbol').addEventListener('click',nextHaiku);
    document.getElementById('nextBottom').addEventListener('click',nextHaiku);
    document.getElementById('continueBtn').addEventListener('click',()=>document.getElementById('analyse').scrollIntoView({behavior:'smooth'}));
    let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(fitHaiku,100)});
    fetch('haikus.json').then(r=>{if(!r.ok)throw new Error('data');return r.json()}).then(data=>{haikus=data;render()}).catch(()=>{cancelPoemAnimation();lines[0].textContent='Haiku’s konden niet laden';lines[1].textContent='probeer de pagina';lines[2].textContent='opnieuw te openen';fitHaiku();playPoem()});
  </script>
</body>
</html>
